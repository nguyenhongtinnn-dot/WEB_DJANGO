{% extends "base.html" %}
{% block title %}{% if instance %}Sửa{% else %}Thêm{% endif %} hãng phim — CineNoir{% endblock %}
{% block content %}
<section class="page-head">
    <h1>{% if instance %}Sửa hãng phim{% else %}Thêm hãng phim{% endif %}</h1>
    <p class="muted">Thông tin studio / nhà sản xuất.</p>
</section>
<form method="post" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="button">Lưu</button>
        <a class="button ghost" href="{% url 'reviews:book_list' %}">Hủy</a>
    </div>
</form>
{% endblock %}
