{% extends "base.html" %}
{% block title %}Media — {{ book.title }}{% endblock %}
{% block content %}
<section class="page-head">
    <h1>Cập nhật media</h1>
    <p class="muted">{{ book.title }} · poster, trailer, file audio.</p>
</section>
<form method="post" enctype="multipart/form-data" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
        <button type="submit" class="button">Tải lên</button>
        <a class="button ghost" href="{% url 'reviews:book_detail' book.pk %}">Quay lại</a>
    </div>
</form>
{% endblock %}
