{% extends "base.html" %}
{% block title %}{{ page_title }} — CineNoir{% endblock %}
{% block content %}
<section class="page-head">
    <p class="eyebrow">Danh mục</p>
    <h1>{{ page_title }}</h1>
    <p class="muted">{{ page_subtitle }}</p>
</section>
<div class="grid">
    {% for film in books %}
        {% include "reviews/_film_card.html" %}
    {% empty %}
        <p class="muted">Chưa có phim trong mục này.</p>
    {% endfor %}
</div>
{% endblock %}
